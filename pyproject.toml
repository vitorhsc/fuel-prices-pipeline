[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-prices-pipeline"
version = "1.0.0"
description = "Daily batch pipeline: Portuguese fuel prices API (DGEG) -> Parquet -> PostgreSQL analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vítor Hugo" }]
dependencies = [
    "requests>=2.31",
    "pyarrow>=15.0",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # IANA time zones on systems without them (e.g. Windows)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.5",
]

[project.scripts]
fuel-prices = "fuel_prices.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuel_prices = ["sql/init/*.sql", "sql/transform/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests that need a running PostgreSQL (set TEST_DATABASE_URL)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
