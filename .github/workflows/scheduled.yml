name: Scheduled run

# Runs the pipeline in the cloud once a day, so the history keeps growing with the Mac switched off.
# The warehouse lives in a managed PostgreSQL (Neon); its connection string is the DATABASE_URL secret.
on:
  schedule:
    # Once a day at 22:17 UTC (Lisbon time in winter, 23:17 in summer), so each run captures the price in
    # force at the end of the day. Not on the hour: GitHub delays scheduled runs most at the top of the hour.
    - cron: "17 22 * * *"
  workflow_dispatch: {}        # "Run workflow" button, for a manual run

# Never two runs at the same time: a new one waits for the previous one to finish.
concurrency:
  group: scheduled-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m fuel_prices run   # exits 1 if any task failed, so GitHub emails you

      - name: Keep the day's Parquet files and quarantine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-zone-${{ github.run_number }}
          path: |
            data/raw
            data/quarantine
          retention-days: 90
          if-no-files-found: ignore
