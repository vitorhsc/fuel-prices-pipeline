services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: analytics
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # host port: set POSTGRES_PORT in .env if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/analytics
      TZ: Europe/Lisbon
    volumes:
      - ./data:/app/data          # Parquet landing zone stays on your machine
      - ./config:/app/config:ro   # edit the config without rebuilding
    profiles: ["pipeline"]        # started on demand: `docker compose run --rm pipeline`

  adminer:                        # lightweight web UI to browse the tables: http://localhost:8080
    image: adminer:4
    depends_on: [postgres]
    ports:
      - "8080:8080"

volumes:
  pgdata:
